language = "C"
include_guard = "MILVUS_GREP_H"
cpp_compat = true
usize_is_size_t = true
style = "type"
autogen_warning = "/* Generated by cbindgen from src/ffi.rs. Do not edit. */"
header = """
/* Milvus Grep memory-only C ABI. Header and library must come from the same
 * build/architecture. This is not a wire or stable plugin ABI.
 * All non-NULL pointers must be live, aligned and cover their claimed extent.
 * Writable outputs/error storage are exclusive for the call and must not
 * overlap each other, input storage, or handle storage.
 * Callers synchronize release with every reader, execution and cancel call.
 * No function can safely validate an arbitrary non-NULL address. */
"""
