quiet: False
with-expecter: True
inpackage: True
filename: "mock_{{.InterfaceNameSnake}}.go"
mockname: "Mock{{.InterfaceName}}"
outpkg: "{{.PackageName}}"
dir: "{{.InterfaceDir}}"
packages:
  github.com/milvus-io/milvus/internal/datacoord:
    interfaces:
      RWChannelStore:
        config:
          filename: mock_channel_store.go
      Cluster:
      ChannelManager:
      SubCluster:
      StatsJobManager:
  github.com/milvus-io/milvus/internal/datacoord/bulkimport:
    interfaces:
      ImportMeta:
  github.com/milvus-io/milvus/internal/datacoord/compaction:
    interfaces:
      TriggerManager:
      CompactionInspector:
        config:
          mockname: MockCompactionInspector
      Trigger:
        config:
          mockname: MockTrigger
  github.com/milvus-io/milvus/internal/datacoord/compaction/task:
    interfaces:
      CompactionMeta:
  github.com/milvus-io/milvus/internal/datacoord/compaction/view:
    interfaces:
      CollectionTopologyQuerier:
  github.com/milvus-io/milvus/internal/datacoord/index:
    interfaces:
      IndexEngineVersionManager:
        config:
          mockname: MockVersionManager
  github.com/milvus-io/milvus/internal/datacoord/partitionstats:
    interfaces:
      PartitionStatsCleaner:
  github.com/milvus-io/milvus/internal/datacoord/segment:
    interfaces:
      Manager:
        config:
          filename: mock_segment_manager.go
  github.com/milvus-io/milvus/internal/datacoord/meta:
    interfaces:
      Handler:
        config:
          mockname: NMockHandler
  github.com/milvus-io/milvus/internal/datacoord/allocator:
    interfaces:
      Allocator:
  github.com/milvus-io/milvus/internal/datacoord/broker:
    interfaces:
      Broker:
  github.com/milvus-io/milvus/internal/datacoord/session:
    interfaces:
      DataNodeManager:
      WorkerManager:
      Cluster:
      NodeManager:
  github.com/milvus-io/milvus/internal/datacoord/task:
    interfaces:
      GlobalScheduler:
      Task:
