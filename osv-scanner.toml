"""

[[IgnoredVulns]]
id = "GO-2026-5932"
ignoreUntil = 2026-11-30
reason = """
golang.org/x/crypto/openpgp is unmaintained and unsafe by design. This is a
permanent advisory on the package, not a defect with a fixed version, so no
x/crypto release will clear it. Milvus does not import it: `go mod why
golang.org/x/crypto/openpgp` reports "main module does not need package".
Keep x/crypto current for its other fixes.
"""
