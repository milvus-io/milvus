name: Python Lint (tests/)

on:
  push:
    branches:
      - master
    paths:
      - 'tests/**/*.py'
      - 'tests/ruff.toml'
      - 'internal/util/function/pyudf/**'
      - 'pkg/proto/pyudf.proto'
      - 'scripts/generate_pyudf_python_proto.py'
      - 'Makefile'
      - '.github/workflows/python-lint.yaml'
  pull_request:
    paths:
      - 'tests/**/*.py'
      - 'tests/ruff.toml'
      - 'internal/util/function/pyudf/**'
      - 'pkg/proto/pyudf.proto'
      - 'scripts/generate_pyudf_python_proto.py'
      - 'Makefile'
      - '.github/workflows/python-lint.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ruff:
    name: Ruff (changed files only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed Python files under tests/
        id: changed
        uses: tj-actions/changed-files@v46
        with:
          files: tests/**/*.py

      - name: ruff check
        if: steps.changed.outputs.any_changed == 'true'
        uses: astral-sh/ruff-action@v4.0.0
        with:
          version: "0.15.11"
          src: ${{ steps.changed.outputs.all_changed_files }}

      - name: ruff format --check
        if: steps.changed.outputs.any_changed == 'true'
        uses: astral-sh/ruff-action@v4.0.0
        with:
          version: "0.15.11"
          src: ${{ steps.changed.outputs.all_changed_files }}
          args: "format --check --diff"

      - name: Validate ruff configuration (smoke test)
        # Always runs so config-only PRs still catch a broken ruff.toml.
        # --exit-zero ignores existing baseline violations; only fails when
        # ruff cannot load the config at all.
        uses: astral-sh/ruff-action@v4.0.0
        with:
          version: "0.15.11"
          src: "tests/scripts"
          args: "check --exit-zero"

      # Keep the existing check identity; run runtime checks in this same job.
      - name: Check PyUDF runtime Python
        uses: astral-sh/ruff-action@v4.0.0
        with:
          version: "0.15.11"
          src: "internal/util/function/pyudf/python scripts/generate_pyudf_python_proto.py"
          args: "check --config internal/util/function/pyudf/python/pyproject.toml"

      - name: Check PyUDF runtime Python formatting
        uses: astral-sh/ruff-action@v4.0.0
        with:
          version: "0.15.11"
          src: "internal/util/function/pyudf/python scripts/generate_pyudf_python_proto.py"
          args: "format --check --diff --config internal/util/function/pyudf/python/pyproject.toml"

      - name: Set up Python for PyUDF tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: internal/util/function/pyudf/python/pyproject.toml

      - name: Build and install PyUDF runtime wheel
        run: |
          python -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/pyudf-wheels" ./internal/util/function/pyudf/python
          for wheel in "$RUNNER_TEMP"/pyudf-wheels/milvus_pyudf_runtime-*.whl; do
            python -m pip install "${wheel}[codegen]"
          done

      - name: Check PyUDF Python protocol products
        run: make check-pyudf-proto-product PYTHON=python

      - name: Run PyUDF Python unit tests
        env:
          PYUDF_TEST_INSTALLED_RUNTIME: '1'
        run: python -m unittest discover -s internal/util/function/pyudf/python/tests -v
