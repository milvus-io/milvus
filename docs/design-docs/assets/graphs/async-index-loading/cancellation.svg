<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="cancellation-title cancellation-desc">
<title id="cancellation-title">Failure boundary: drain before releasing inputs</title>
<desc id="cancellation-desc">Cancellation drains issued reads, writes and engine calls before releasing inputs and cleaning owned files; the load returns failure.</desc>
<defs>
<marker id="cancellation-arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#566A80"/></marker>
<marker id="cancellation-accent" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#397985"/></marker>
<marker id="cancellation-link" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#557794"/></marker>
</defs>
<rect width="1280" height="720" fill="#FCFDFE"/>
<g font-family="Geist, Arial, sans-serif">
<text x="40" y="56" font-size="28" fill="#25364A" text-anchor="start" font-weight="400">Failure boundary: drain before releasing inputs</text>
<text x="40" y="88" font-size="16" fill="#566A80" text-anchor="start" font-weight="400">Cancellation stops new work; an issued native read or engine call must finish safely.</text>
<line x1="128" y1="168" x2="128" y2="632" stroke="#CDD9E2" stroke-dasharray="4 4"/>
<line x1="456" y1="168" x2="456" y2="632" stroke="#CDD9E2" stroke-dasharray="4 4"/>
<line x1="784" y1="168" x2="784" y2="632" stroke="#CDD9E2" stroke-dasharray="4 4"/>
<line x1="1112" y1="168" x2="1112" y2="632" stroke="#CDD9E2" stroke-dasharray="4 4"/>
<rect x="24" y="112" width="208" height="56" rx="8" fill="#FFFFFF" stroke="#CDD9E2"/>
<text x="128" y="136" font-size="16" fill="#25364A" text-anchor="middle" font-weight="600">Load caller</text>
<text x="128" y="156" font-size="12" fill="#566A80" text-anchor="middle" font-weight="400">cancel / await failure</text>
<rect x="352" y="112" width="208" height="56" rx="8" fill="#EFF7F5" stroke="#397985"/>
<text x="456" y="136" font-size="16" fill="#25364A" text-anchor="middle" font-weight="600">Async worker</text>
<text x="456" y="156" font-size="12" fill="#566A80" text-anchor="middle" font-weight="400">load + cleanup owner</text>
<rect x="680" y="112" width="208" height="56" rx="8" fill="#FFFFFF" stroke="#CDD9E2"/>
<text x="784" y="136" font-size="16" fill="#25364A" text-anchor="middle" font-weight="600">Storage backend</text>
<text x="784" y="156" font-size="12" fill="#566A80" text-anchor="middle" font-weight="400">issued request</text>
<rect x="1008" y="112" width="208" height="56" rx="8" fill="#FFFFFF" stroke="#CDD9E2"/>
<text x="1112" y="136" font-size="16" fill="#25364A" text-anchor="middle" font-weight="600">LocalFileIOPool</text>
<text x="1112" y="156" font-size="12" fill="#566A80" text-anchor="middle" font-weight="400">pending file operations</text>
<path d="M 128 208 L 456 208" fill="none" stroke="#566A80" stroke-width="1.2" marker-end="url(#cancellation-arrow)"/>
<rect x="260.0" y="180" width="64" height="20" fill="#FCFDFE"/>
<text x="292.0" y="196" font-size="16" fill="#566A80" text-anchor="middle" font-weight="400">CANCEL</text>
<rect x="304" y="220" width="304" height="32" rx="4" fill="#EFF7F5"/>
<text x="456" y="240" font-size="12" fill="#566A80" text-anchor="middle" font-weight="400">Stop dispatch; cancel pending admission</text>
<path d="M 784 280 L 456 280" fill="none" stroke="#566A80" stroke-width="1.2" stroke-dasharray="4 4" marker-end="url(#cancellation-arrow)"/>
<rect x="572.0" y="252" width="96" height="20" fill="#FCFDFE"/>
<text x="620.0" y="268" font-size="16" fill="#566A80" text-anchor="middle" font-weight="400">DRAIN READ</text>
<path d="M 1112 316 L 456 316" fill="none" stroke="#566A80" stroke-width="1.2" stroke-dasharray="4 4" marker-end="url(#cancellation-arrow)"/>
<rect x="896.0" y="288" width="104" height="20" fill="#FCFDFE"/>
<text x="948.0" y="304" font-size="16" fill="#566A80" text-anchor="middle" font-weight="400">DRAIN WRITE</text>
<rect x="304" y="328" width="304" height="32" rx="4" fill="#EFF7F5"/>
<text x="456" y="348" font-size="12" fill="#566A80" text-anchor="middle" font-weight="400">Release buffers and slice leases</text>
<rect x="304" y="364" width="304" height="32" rx="4" fill="#EFF7F5"/>
<text x="456" y="384" font-size="12" fill="#566A80" text-anchor="middle" font-weight="400">Wait for in-progress engine restoration</text>
<rect x="304" y="400" width="304" height="32" rx="4" fill="#EFF7F5"/>
<text x="456" y="420" font-size="12" fill="#566A80" text-anchor="middle" font-weight="400">Release failed reader / borrowed inputs</text>
<path d="M 456 460 L 1112 460" fill="none" stroke="#566A80" stroke-width="1.2" marker-end="url(#cancellation-arrow)"/>
<rect x="560.0" y="432" width="120" height="20" fill="#FCFDFE"/>
<text x="620.0" y="448" font-size="16" fill="#566A80" text-anchor="middle" font-weight="400">CLEANUP FILES</text>
<path d="M 1112 496 L 456 496" fill="none" stroke="#566A80" stroke-width="1.2" stroke-dasharray="4 4" marker-end="url(#cancellation-arrow)"/>
<rect x="876.0" y="468" width="144" height="20" fill="#FCFDFE"/>
<text x="948.0" y="484" font-size="16" fill="#566A80" text-anchor="middle" font-weight="400">CLEANUP COMPLETE</text>
<path d="M 456 532 L 128 532" fill="none" stroke="#566A80" stroke-width="1.2" stroke-dasharray="4 4" marker-end="url(#cancellation-arrow)"/>
<rect x="240.0" y="504" width="104" height="20" fill="#FCFDFE"/>
<text x="292.0" y="520" font-size="16" fill="#566A80" text-anchor="middle" font-weight="400">LOAD FAILED</text>
<line x1="40" y1="648" x2="1240" y2="648" stroke="#CDD9E2"/>
<text x="40" y="676" font-size="16" fill="#566A80" text-anchor="start" font-weight="400">Do not publish or commit partial results. Cleanup preserves the original failure.</text>
<text x="40" y="700" font-size="16" fill="#566A80" text-anchor="start" font-weight="400">Pending admission owns no resources; issued reads keep destinations alive until completion.</text>
</g></svg>
