<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="knowhere-architecture-title knowhere-architecture-desc">
<title id="knowhere-architecture-title">Knowhere: prepared inputs, engine-owned restore</title>
<desc id="knowhere-architecture-desc">The shared legacy loader prepares a BinarySet or positioned files before Knowhere restores the index on the async executor.</desc>
<defs>
<marker id="knowhere-architecture-arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#566A80"/></marker>
<marker id="knowhere-architecture-accent" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#397985"/></marker>
<marker id="knowhere-architecture-link" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#557794"/></marker>
</defs>
<rect width="1280" height="720" fill="#FCFDFE"/>
<g font-family="Geist, Arial, sans-serif">
<text x="40" y="56" font-size="28" fill="#25364A" text-anchor="start" font-weight="400">Knowhere: prepared inputs, engine-owned restore</text>
<text x="40" y="88" font-size="16" fill="#566A80" text-anchor="start" font-weight="400">Milvus streams selected inputs; Knowhere controls deserialization and later backend reads.</text>
<path d="M 360 248 L 456 248" fill="none" stroke="#566A80" stroke-width="1.2" marker-end="url(#knowhere-architecture-arrow)"/>
<path d="M 776 248 L 872 248" fill="none" stroke="#566A80" stroke-width="1.2" marker-end="url(#knowhere-architecture-arrow)"/>
<path d="M 520 320 L 520 360 Q 520 368 512 368 L 208 368 Q 200 368 200 376 L 200 420" fill="none" stroke="#566A80" stroke-width="1.2" marker-end="url(#knowhere-architecture-arrow)"/>
<path d="M 360 492 L 456 492" fill="none" stroke="#566A80" stroke-width="1.2" marker-end="url(#knowhere-architecture-arrow)"/>
<path d="M 776 492 L 872 492" fill="none" stroke="#566A80" stroke-width="1.2" marker-end="url(#knowhere-architecture-arrow)"/>
<path d="M 1032 320 L 1032 420" fill="none" stroke="#566A80" stroke-width="1.2" marker-end="url(#knowhere-architecture-arrow)"/>
<g data-node="Legacy index objects"><rect x="40" y="176" width="320" height="144" rx="8" fill="#FFFFFF" stroke="#CDD9E2" stroke-width="1.2"/>
<text x="60" y="212" font-size="20" fill="#25364A" text-anchor="start" font-weight="600">Legacy index objects</text>
<text x="60" y="244" font-size="16" fill="#566A80" text-anchor="start" font-weight="400">Main data + metadata sidecars</text>
<text x="60" y="268" font-size="16" fill="#566A80" text-anchor="start" font-weight="400">Envelope snapshots reused</text>
</g>
<g data-node="LegacyIndexLoader"><rect x="456" y="176" width="320" height="144" rx="8" fill="#EFF7F5" stroke="#397985" stroke-width="1.2"/>
<text x="476" y="212" font-size="20" fill="#25364A" text-anchor="start" font-weight="600">LegacyIndexLoader</text>
<text x="476" y="244" font-size="16" fill="#566A80" text-anchor="start" font-weight="400">Admit / read / decode / consume</text>
<text x="476" y="268" font-size="16" fill="#566A80" text-anchor="start" font-weight="400">At most 16 MiB per raw read</text>
</g>
<g data-node="Memory inputs"><rect x="872" y="176" width="320" height="144" rx="8" fill="#FFFFFF" stroke="#CDD9E2" stroke-width="1.2"/>
<text x="892" y="212" font-size="20" fill="#25364A" text-anchor="start" font-weight="600">Memory inputs</text>
<text x="892" y="244" font-size="16" fill="#566A80" text-anchor="start" font-weight="400">Complete BinarySet</text>
<text x="892" y="268" font-size="16" fill="#566A80" text-anchor="start" font-weight="400">Nullable / empty-list sidecars</text>
</g>
<g data-node="LocalFileIOPool"><rect x="40" y="420" width="320" height="144" rx="8" fill="#FFFFFF" stroke="#CDD9E2" stroke-width="1.2"/>
<text x="60" y="456" font-size="20" fill="#25364A" text-anchor="start" font-weight="600">LocalFileIOPool</text>
<text x="60" y="488" font-size="16" fill="#566A80" text-anchor="start" font-weight="400">WriteAt to disjoint file offsets</text>
<text x="60" y="512" font-size="16" fill="#566A80" text-anchor="start" font-weight="400">Exact-length Finish after drain</text>
</g>
<g data-node="mmap / disk inputs"><rect x="456" y="420" width="320" height="144" rx="8" fill="#FFFFFF" stroke="#CDD9E2" stroke-width="1.2"/>
<text x="476" y="456" font-size="20" fill="#25364A" text-anchor="start" font-weight="600">mmap / disk inputs</text>
<text x="476" y="488" font-size="16" fill="#566A80" text-anchor="start" font-weight="400">mmap: one entry per target file</text>
<text x="476" y="512" font-size="16" fill="#566A80" text-anchor="start" font-weight="400">Disk: preserve selected-file set</text>
</g>
<g data-node="Knowhere on async worker"><rect x="872" y="420" width="320" height="144" rx="8" fill="#FFFFFF" stroke="#CDD9E2" stroke-width="1.2"/>
<text x="892" y="456" font-size="20" fill="#25364A" text-anchor="start" font-weight="600">Knowhere on async worker</text>
<text x="892" y="488" font-size="16" fill="#566A80" text-anchor="start" font-weight="400">Deserialize / DeserializeFromFile</text>
<text x="892" y="512" font-size="16" fill="#566A80" text-anchor="start" font-weight="400">No slice lease during engine call</text>
</g>
<line x1="40" y1="648" x2="1240" y2="648" stroke="#CDD9E2"/>
<text x="40" y="676" font-size="16" fill="#566A80" text-anchor="start" font-weight="400">Mmap embedding metadata and optional raw index use separate files; validity sidecars stay in heap.</text>
<text x="40" y="700" font-size="16" fill="#566A80" text-anchor="start" font-weight="400">Stream-capable engine reads remain backend-owned; staging does not eagerly fetch every object.</text>
</g></svg>
