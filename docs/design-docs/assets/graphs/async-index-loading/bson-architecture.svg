<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="bson-architecture-title bson-architecture-desc">
<title id="bson-architecture-title">BSON shared-key: legacy files to Tantivy</title>
<desc id="bson-architecture-desc">BSON shared-key loading uses admitted legacy reads and positioned staging before opening Tantivy and applying heap or mmap ownership.</desc>
<defs>
<marker id="bson-architecture-arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#566A80"/></marker>
<marker id="bson-architecture-accent" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#397985"/></marker>
<marker id="bson-architecture-link" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#557794"/></marker>
</defs>
<rect width="1280" height="720" fill="#FCFDFE"/>
<g font-family="Geist, Arial, sans-serif">
<text x="40" y="56" font-size="28" fill="#25364A" text-anchor="start" font-weight="400">BSON shared-key: legacy files to Tantivy</text>
<text x="40" y="88" font-size="16" fill="#566A80" text-anchor="start" font-weight="400">shared_key_index/meta.json_0 uses the legacy index format; JSON stats meta.json is raw JSON.</text>
<path d="M 360 248 L 456 248" fill="none" stroke="#566A80" stroke-width="1.2" marker-end="url(#bson-architecture-arrow)"/>
<path d="M 776 248 L 872 248" fill="none" stroke="#566A80" stroke-width="1.2" marker-end="url(#bson-architecture-arrow)"/>
<path d="M 1032 320 L 1032 420" fill="none" stroke="#566A80" stroke-width="1.2" marker-end="url(#bson-architecture-arrow)"/>
<path d="M 872 492 L 776 492" fill="none" stroke="#566A80" stroke-width="1.2" marker-end="url(#bson-architecture-arrow)"/>
<path d="M 456 492 L 360 492" fill="none" stroke="#566A80" stroke-width="1.2" marker-end="url(#bson-architecture-arrow)"/>
<g data-node="Shared-key objects"><rect x="40" y="176" width="320" height="144" rx="8" fill="#FFFFFF" stroke="#CDD9E2" stroke-width="1.2"/>
<text x="60" y="212" font-size="20" fill="#25364A" text-anchor="start" font-weight="600">Shared-key objects</text>
<text x="60" y="244" font-size="16" fill="#566A80" text-anchor="start" font-weight="400">meta.json_0 + segment slices</text>
<text x="60" y="268" font-size="16" fill="#566A80" text-anchor="start" font-weight="400">BSON translator passes context</text>
</g>
<g data-node="DiskFileManagerImpl"><rect x="456" y="176" width="320" height="144" rx="8" fill="#FFFFFF" stroke="#CDD9E2" stroke-width="1.2"/>
<text x="476" y="212" font-size="20" fill="#25364A" text-anchor="start" font-weight="600">DiskFileManagerImpl</text>
<text x="476" y="244" font-size="16" fill="#566A80" text-anchor="start" font-weight="400">Reuse inspected file metadata</text>
<text x="476" y="268" font-size="16" fill="#566A80" text-anchor="start" font-weight="400">One generated directory per load</text>
</g>
<g data-node="LegacyIndexLoader"><rect x="872" y="176" width="320" height="144" rx="8" fill="#EFF7F5" stroke="#397985" stroke-width="1.2"/>
<text x="892" y="212" font-size="20" fill="#25364A" text-anchor="start" font-weight="600">LegacyIndexLoader</text>
<text x="892" y="244" font-size="16" fill="#566A80" text-anchor="start" font-weight="400">Budget / read / decode</text>
<text x="892" y="268" font-size="16" fill="#566A80" text-anchor="start" font-weight="400">Write bytes at their offsets</text>
</g>
<g data-node="BSON reader"><rect x="40" y="420" width="320" height="144" rx="8" fill="#FFFFFF" stroke="#CDD9E2" stroke-width="1.2"/>
<text x="60" y="456" font-size="20" fill="#25364A" text-anchor="start" font-weight="600">BSON reader</text>
<text x="60" y="488" font-size="16" fill="#566A80" text-anchor="start" font-weight="400">Heap: remove staging before return</text>
<text x="60" y="512" font-size="16" fill="#566A80" text-anchor="start" font-weight="400">mmap: retain files with index</text>
</g>
<g data-node="FinishLegacyLoad"><rect x="456" y="420" width="320" height="144" rx="8" fill="#FFFFFF" stroke="#CDD9E2" stroke-width="1.2"/>
<text x="476" y="456" font-size="20" fill="#25364A" text-anchor="start" font-weight="600">FinishLegacyLoad</text>
<text x="476" y="488" font-size="16" fill="#566A80" text-anchor="start" font-weight="400">Open Tantivy on async worker</text>
<text x="476" y="512" font-size="16" fill="#566A80" text-anchor="start" font-weight="400">After reads and writes finish</text>
</g>
<g data-node="LocalFileIOPool"><rect x="872" y="420" width="320" height="144" rx="8" fill="#FFFFFF" stroke="#CDD9E2" stroke-width="1.2"/>
<text x="892" y="456" font-size="20" fill="#25364A" text-anchor="start" font-weight="600">LocalFileIOPool</text>
<text x="892" y="488" font-size="16" fill="#566A80" text-anchor="start" font-weight="400">WriteAt / Finish staging files</text>
<text x="892" y="512" font-size="16" fill="#566A80" text-anchor="start" font-weight="400">Cleanup owned directory</text>
</g>
<line x1="40" y1="648" x2="1240" y2="648" stroke="#CDD9E2"/>
<text x="40" y="676" font-size="16" fill="#566A80" text-anchor="start" font-weight="400">This entry remains legacy; it does not use the packed scalar V3 reader.</text>
<text x="40" y="700" font-size="16" fill="#566A80" text-anchor="start" font-weight="400">No whole-index BinarySet copy. On failure, release the reader before cleaning its directory.</text>
</g></svg>
