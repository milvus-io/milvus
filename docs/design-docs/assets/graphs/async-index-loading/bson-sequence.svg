<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="bson-sequence-title bson-sequence-desc">
<title id="bson-sequence-title">BSON shared-key: legacy heap loading</title>
<desc id="bson-sequence-desc">BSON shared-key files stream to an isolated directory before Tantivy opens; heap loading awaits cleanup before returning.</desc>
<defs>
<marker id="bson-sequence-arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#566A80"/></marker>
<marker id="bson-sequence-accent" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#397985"/></marker>
<marker id="bson-sequence-link" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#557794"/></marker>
</defs>
<rect width="1280" height="720" fill="#FCFDFE"/>
<g font-family="Geist, Arial, sans-serif">
<text x="40" y="56" font-size="28" fill="#25364A" text-anchor="start" font-weight="400">BSON shared-key: legacy heap loading</text>
<text x="40" y="88" font-size="16" fill="#566A80" text-anchor="start" font-weight="400">The directory belongs to this load; mmap mode retains it instead of removing it.</text>
<line x1="128" y1="168" x2="128" y2="632" stroke="#CDD9E2" stroke-dasharray="4 4"/>
<line x1="456" y1="168" x2="456" y2="632" stroke="#CDD9E2" stroke-dasharray="4 4"/>
<line x1="784" y1="168" x2="784" y2="632" stroke="#CDD9E2" stroke-dasharray="4 4"/>
<line x1="1112" y1="168" x2="1112" y2="632" stroke="#CDD9E2" stroke-dasharray="4 4"/>
<rect x="24" y="112" width="208" height="56" rx="8" fill="#FFFFFF" stroke="#CDD9E2"/>
<text x="128" y="136" font-size="16" fill="#25364A" text-anchor="middle" font-weight="600">Cache caller</text>
<text x="128" y="156" font-size="12" fill="#566A80" text-anchor="middle" font-weight="400">synchronous boundary</text>
<rect x="352" y="112" width="208" height="56" rx="8" fill="#EFF7F5" stroke="#397985"/>
<text x="456" y="136" font-size="16" fill="#25364A" text-anchor="middle" font-weight="600">Async worker</text>
<text x="456" y="156" font-size="12" fill="#566A80" text-anchor="middle" font-weight="400">load coroutine</text>
<rect x="680" y="112" width="208" height="56" rx="8" fill="#FFFFFF" stroke="#CDD9E2"/>
<text x="784" y="136" font-size="16" fill="#25364A" text-anchor="middle" font-weight="600">Storage backend</text>
<text x="784" y="156" font-size="12" fill="#566A80" text-anchor="middle" font-weight="400">native I/O</text>
<rect x="1008" y="112" width="208" height="56" rx="8" fill="#FFFFFF" stroke="#CDD9E2"/>
<text x="1112" y="136" font-size="16" fill="#25364A" text-anchor="middle" font-weight="600">LocalFileIOPool</text>
<text x="1112" y="156" font-size="12" fill="#566A80" text-anchor="middle" font-weight="400">file operations</text>
<path d="M 128 208 L 456 208" fill="none" stroke="#566A80" stroke-width="1.2" marker-end="url(#bson-sequence-arrow)"/>
<rect x="268.0" y="180" width="48" height="20" fill="#FCFDFE"/>
<text x="292.0" y="196" font-size="16" fill="#566A80" text-anchor="middle" font-weight="400">LOAD</text>
<path d="M 456 244 L 1112 244" fill="none" stroke="#566A80" stroke-width="1.2" marker-end="url(#bson-sequence-arrow)"/>
<rect x="572.0" y="216" width="96" height="20" fill="#FCFDFE"/>
<text x="620.0" y="232" font-size="16" fill="#566A80" text-anchor="middle" font-weight="400">CREATE DIR</text>
<rect x="304" y="256" width="304" height="32" rx="4" fill="#EFF7F5"/>
<text x="456" y="276" font-size="12" fill="#566A80" text-anchor="middle" font-weight="400">Reuse envelopes; acquire bytes + slot</text>
<path d="M 456 316 L 784 316" fill="none" stroke="#566A80" stroke-width="1.2" marker-end="url(#bson-sequence-arrow)"/>
<rect x="572.0" y="288" width="96" height="20" fill="#FCFDFE"/>
<text x="620.0" y="304" font-size="16" fill="#566A80" text-anchor="middle" font-weight="400">READ RANGE</text>
<path d="M 784 352 L 456 352" fill="none" stroke="#566A80" stroke-width="1.2" stroke-dasharray="4 4" marker-end="url(#bson-sequence-arrow)"/>
<rect x="584.0" y="324" width="72" height="20" fill="#FCFDFE"/>
<text x="620.0" y="340" font-size="16" fill="#566A80" text-anchor="middle" font-weight="400">PAYLOAD</text>
<path d="M 456 388 L 1112 388" fill="none" stroke="#566A80" stroke-width="1.2" marker-end="url(#bson-sequence-arrow)"/>
<rect x="552.0" y="360" width="136" height="20" fill="#FCFDFE"/>
<text x="620.0" y="376" font-size="16" fill="#566A80" text-anchor="middle" font-weight="400">WRITE AT OFFSET</text>
<path d="M 1112 424 L 456 424" fill="none" stroke="#566A80" stroke-width="1.2" stroke-dasharray="4 4" marker-end="url(#bson-sequence-arrow)"/>
<rect x="884.0" y="396" width="128" height="20" fill="#FCFDFE"/>
<text x="948.0" y="412" font-size="16" fill="#566A80" text-anchor="middle" font-weight="400">WRITE COMPLETE</text>
<rect x="304" y="436" width="304" height="32" rx="4" fill="#EFF7F5"/>
<text x="456" y="456" font-size="12" fill="#566A80" text-anchor="middle" font-weight="400">Release unit; join and await file close</text>
<rect x="304" y="472" width="304" height="32" rx="4" fill="#EFF7F5"/>
<text x="456" y="492" font-size="12" fill="#566A80" text-anchor="middle" font-weight="400">FinishLegacyLoad opens Tantivy</text>
<path d="M 456 532 L 1112 532" fill="none" stroke="#566A80" stroke-width="1.2" marker-end="url(#bson-sequence-arrow)"/>
<rect x="564.0" y="504" width="112" height="20" fill="#FCFDFE"/>
<text x="620.0" y="520" font-size="16" fill="#566A80" text-anchor="middle" font-weight="400">HEAP CLEANUP</text>
<path d="M 1112 568 L 456 568" fill="none" stroke="#566A80" stroke-width="1.2" stroke-dasharray="4 4" marker-end="url(#bson-sequence-arrow)"/>
<rect x="888.0" y="540" width="120" height="20" fill="#FCFDFE"/>
<text x="948.0" y="556" font-size="16" fill="#566A80" text-anchor="middle" font-weight="400">FILES REMOVED</text>
<path d="M 456 604 L 128 604" fill="none" stroke="#397985" stroke-width="1.2" marker-end="url(#bson-sequence-accent)"/>
<rect x="264.0" y="576" width="56" height="20" fill="#FCFDFE"/>
<text x="292.0" y="592" font-size="16" fill="#566A80" text-anchor="middle" font-weight="400">READY</text>
<line x1="40" y1="648" x2="1240" y2="648" stroke="#CDD9E2"/>
<text x="40" y="676" font-size="16" fill="#566A80" text-anchor="start" font-weight="400">Each write completes before its unit lease is returned. No whole-index BinarySet is assembled.</text>
<text x="40" y="700" font-size="16" fill="#566A80" text-anchor="start" font-weight="400">On failure, drain reads/writes, release the reader, then clean this load&#x27;s directory.</text>
</g></svg>
