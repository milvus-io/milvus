<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="880" viewBox="0 0 1280 880" role="img" aria-labelledby="packed-sequence-title packed-sequence-desc">
<title id="packed-sequence-title">Packed V3: load bytes, then open the index</title>
<desc id="packed-sequence-desc">Async stream open caches file size; ReadEntriesAsync prepares targets and fills them via ReadAtAsync before FinishLoadAsync restores query state.</desc>
<defs>
<marker id="packed-sequence-arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#566A80"/></marker>
<marker id="packed-sequence-accent" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#397985"/></marker>
<marker id="packed-sequence-link" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#557794"/></marker>
</defs>
<rect width="1280" height="880" fill="#FCFDFE"/>
<g font-family="Geist, Arial, sans-serif">
<text x="40" y="56" font-size="28" fill="#25364A" text-anchor="start" font-weight="400">Packed V3: load bytes, then open the index</text>
<text x="40" y="88" font-size="16" fill="#566A80" text-anchor="start" font-weight="400">Numeric Sort mmap example; one raw slice is expanded below.</text>
<line x1="128" y1="168" x2="128" y2="788.0" stroke="#CDD9E2" stroke-dasharray="4 4"/>
<line x1="456" y1="168" x2="456" y2="788.0" stroke="#CDD9E2" stroke-dasharray="4 4"/>
<line x1="784" y1="168" x2="784" y2="788.0" stroke="#CDD9E2" stroke-dasharray="4 4"/>
<line x1="1112" y1="168" x2="1112" y2="788.0" stroke="#CDD9E2" stroke-dasharray="4 4"/>
<rect x="24" y="112" width="208" height="56" rx="8" fill="#FFFFFF" stroke="#CDD9E2"/>
<text x="128" y="136" font-size="16" fill="#25364A" text-anchor="middle" font-weight="600">Cache caller</text>
<text x="128" y="156" font-size="12" fill="#566A80" text-anchor="middle" font-weight="400">synchronous boundary</text>
<rect x="352" y="112" width="208" height="56" rx="8" fill="#EFF7F5" stroke="#397985"/>
<text x="456" y="136" font-size="16" fill="#25364A" text-anchor="middle" font-weight="600">Async worker</text>
<text x="456" y="156" font-size="12" fill="#566A80" text-anchor="middle" font-weight="400">load coroutine</text>
<rect x="680" y="112" width="208" height="56" rx="8" fill="#FFFFFF" stroke="#CDD9E2"/>
<text x="784" y="136" font-size="16" fill="#25364A" text-anchor="middle" font-weight="600">Storage backend</text>
<text x="784" y="156" font-size="12" fill="#566A80" text-anchor="middle" font-weight="400">through RemoteInputStream</text>
<rect x="1008" y="112" width="208" height="56" rx="8" fill="#FFFFFF" stroke="#CDD9E2"/>
<text x="1112" y="136" font-size="16" fill="#25364A" text-anchor="middle" font-weight="600">LocalFileIOPool</text>
<text x="1112" y="156" font-size="12" fill="#566A80" text-anchor="middle" font-weight="400">file operations</text>
<path d="M 128 208 L 456 208" fill="none" stroke="#566A80" stroke-width="1.2" marker-end="url(#packed-sequence-arrow)"/>
<rect x="268.0" y="180" width="48" height="20" fill="#FCFDFE"/>
<text x="292.0" y="196" font-size="16" fill="#566A80" text-anchor="middle" font-weight="400">LOAD</text>
<path d="M 456 244 L 784 244" fill="none" stroke="#566A80" stroke-width="1.2" marker-end="url(#packed-sequence-arrow)"/>
<rect x="524" y="216" width="192" height="20" fill="#FCFDFE"/>
<text x="620" y="232" font-size="16" fill="#566A80" text-anchor="middle">OpenInputStreamAsync</text>
<path d="M 784 280 L 456 280" fill="none" stroke="#566A80" stroke-width="1.2" stroke-dasharray="4 4" marker-end="url(#packed-sequence-arrow)"/>
<rect x="508" y="252" width="224" height="20" fill="#FCFDFE"/>
<text x="620" y="268" font-size="16" fill="#566A80" text-anchor="middle">STREAM + CACHED SIZE</text>
<rect x="304" y="304" width="304" height="32" rx="4" fill="#EFF7F5"/>
<text x="456" y="324" font-size="12" fill="#566A80" text-anchor="middle" font-weight="400">Reader.Open(); index.PlanLoad()</text>
<path d="M 456 364 L 1112 364" fill="none" stroke="#566A80" stroke-width="1.2" marker-end="url(#packed-sequence-arrow)"/>
<rect x="584.0" y="336" width="72" height="20" fill="#FCFDFE"/>
<text x="620.0" y="352" font-size="16" fill="#566A80" text-anchor="middle" font-weight="400">PREPARE</text>
<path d="M 1112 400 L 456 400" fill="none" stroke="#566A80" stroke-width="1.2" stroke-dasharray="4 4" marker-end="url(#packed-sequence-arrow)"/>
<rect x="888.0" y="372" width="120" height="20" fill="#FCFDFE"/>
<text x="948.0" y="388" font-size="16" fill="#566A80" text-anchor="middle" font-weight="400">TARGETS READY</text>
<rect x="304" y="412" width="304" height="32" rx="4" fill="#EFF7F5"/>
<text x="456" y="432" font-size="12" fill="#566A80" text-anchor="middle" font-weight="400">ReadEntriesAsync: acquire bytes + slot</text>
<path d="M 456 472 L 784 472" fill="none" stroke="#566A80" stroke-width="1.2" marker-end="url(#packed-sequence-arrow)"/>
<rect x="556.0" y="444" width="128" height="20" fill="#FCFDFE"/>
<text x="620.0" y="460" font-size="16" fill="#566A80" text-anchor="middle" font-weight="400">ReadAtAsync</text>
<path d="M 784 508 L 456 508" fill="none" stroke="#566A80" stroke-width="1.2" stroke-dasharray="4 4" marker-end="url(#packed-sequence-arrow)"/>
<rect x="560.0" y="480" width="120" height="20" fill="#FCFDFE"/>
<text x="620.0" y="496" font-size="16" fill="#566A80" text-anchor="middle" font-weight="400">READ COMPLETE</text>
<rect x="304" y="520" width="304" height="32" rx="4" fill="#EFF7F5"/>
<text x="456" y="540" font-size="12" fill="#566A80" text-anchor="middle" font-weight="400">Check slice checksum</text>
<path d="M 456 580 L 1112 580" fill="none" stroke="#566A80" stroke-width="1.2" marker-end="url(#packed-sequence-arrow)"/>
<text x="784" y="568" font-size="16" fill="#566A80" text-anchor="middle">WriteAt: permit + bandwidth limit</text>
<path d="M 1112 616 L 456 616" fill="none" stroke="#566A80" stroke-width="1.2" stroke-dasharray="4 4" marker-end="url(#packed-sequence-arrow)"/>
<text x="784" y="604" font-size="16" fill="#566A80" text-anchor="middle">WRITE DONE; release slice lease</text>
<path d="M 456 652 L 1112 652" fill="none" stroke="#566A80" stroke-width="1.2" marker-end="url(#packed-sequence-arrow)"/>
<rect x="560.0" y="624.0" width="120" height="20" fill="#FCFDFE"/>
<text x="620.0" y="640.0" font-size="16" fill="#566A80" text-anchor="middle" font-weight="400">CLOSE TARGETS</text>
<path d="M 1112 688 L 456 688" fill="none" stroke="#566A80" stroke-width="1.2" stroke-dasharray="4 4" marker-end="url(#packed-sequence-arrow)"/>
<rect x="884.0" y="660.0" width="128" height="20" fill="#FCFDFE"/>
<text x="948.0" y="676.0" font-size="16" fill="#566A80" text-anchor="middle" font-weight="400">TARGETS CLOSED</text>
<rect x="304" y="700.0" width="304" height="32" rx="4" fill="#EFF7F5"/>
<text x="456" y="720.0" font-size="12" fill="#566A80" text-anchor="middle" font-weight="400">FinishLoadAsync(plan)</text>
<path d="M 456 760 L 128 760" fill="none" stroke="#397985" stroke-width="1.2" marker-end="url(#packed-sequence-accent)"/>
<rect x="264.0" y="732.0" width="56" height="20" fill="#FCFDFE"/>
<text x="292.0" y="748.0" font-size="16" fill="#566A80" text-anchor="middle" font-weight="400">READY</text>
<line x1="40" y1="804.0" x2="1240" y2="804.0" stroke="#CDD9E2"/>
<text x="40" y="832.0" font-size="16" fill="#566A80" text-anchor="start" font-weight="400">Each file slice holds admission until its local write completes.</text>
<text x="40" y="856.0" font-size="16" fill="#566A80" text-anchor="start" font-weight="400">Engine restoration runs on the async worker. Plan commit and file cleanup use the file pool.</text>
</g></svg>
