syntax = "proto3";
package milvus.proto.clustering;

option go_package = "github.com/milvus-io/milvus/pkg/v3/proto/clusteringpb";
import "schema.proto";
import "common.proto";

// Synchronously modify StorageConfig in index_coord.proto/index_cgo_msg.proto file
message StorageConfig {
  string address = 1;
  string access_keyID = 2;
  string secret_access_key = 3;
  bool useSSL = 4;
  string bucket_name = 5;
  string root_path = 6;
  bool useIAM = 7;
  string IAMEndpoint = 8;
  string storage_type = 9;
  bool use_virtual_host = 10;
  string region = 11;
  string cloud_provider = 12;
  int64 request_timeout_ms = 13;
  string sslCACert = 14;
  string GcpCredentialJSON = 15;
  uint32 max_connections = 16;
  string ssl_tls_min_version = 17;
  bool use_crc32c_checksum = 18;
  uint32 talon_mode = 19;
  uint32 talon_small_read_threshold = 20;
  string talon_coordinator = 21;
  uint32 talon_block_size = 22;
  uint32 talon_max_idle_per_addr = 23;
  bool talon_enable_for_external_table = 24;
}

message InsertFiles {
  repeated string insert_files = 1;
}

message AnalyzeInfo {
  string clusterID = 1;
  int64 buildID = 2;
  int64 collectionID = 3;
  int64 partitionID = 4;
  int64 segmentID = 5;
  int64 version = 6;
  int64 dim = 7;
  int64 num_clusters = 8;
  int64 train_size = 9;
  double min_cluster_ratio = 10;  // min_cluster_size / avg_cluster_size < min_cluster_ratio, is skew
  double max_cluster_ratio = 11;  // max_cluster_size / avg_cluster_size > max_cluster_ratio, is skew
  int64 max_cluster_size = 12;
  map<int64, InsertFiles> insert_files = 13;
  map<int64, int64> num_rows = 14;
  schema.FieldSchema field_schema = 15;
  StorageConfig storage_config = 16;
  // segmentID -> manifest path. A non-empty entry marks a StorageV3 segment
  // read through the manifest; V1 segments use insert_files instead.
  map<int64, string> manifest_paths = 17;
  string cluster_type = 18;
  // Knowhere analyze parameters frozen in the AnalyzeTask.
  map<string, string> cluster_params = 19;
}

message ClusteringCentroidsStats {
  repeated schema.VectorField centroids = 1;
}

message ClusteringCentroidIdMappingStats {
  // Dense offsets into this Analyze generation, not persistent centroid IDs.
  repeated uint32 centroid_id_mapping = 1;
  repeated int64 num_in_centroid = 2;
  // One finite distance per input row, aligned with centroid_id_mapping.
  // Mapping sorts by centroid, then by ascending distance within each centroid.
  repeated float distance_to_centroid = 3;
}

// Immutable index artifacts for the complete snapshot's clustering field.
// Index labels identify cluster offsets, mapped to physical rows by
// ClusteringRange. Scope, field and cluster count come from the snapshot,
// not segment/index-task identities.
message ClusteringIndexInfo {
  // Persisted build parameters, including index_type exactly once. Vector
  // indexes also require metric_type. QueryNode-local load parameters are
  // merged into a copy at load time.
  repeated common.KeyValuePair index_params = 1;
  // Complete object keys, using the existing index codec and slice naming.
  repeated string index_file_paths = 2;
  // Version of the index engine selected by the enclosing field's data_type:
  // FieldIndexInfo.current_index_version for vectors, current_scalar_index_version
  // for scalars. These are separate version domains. This is not a snapshot or
  // index-build generation. Scalar execution is a follow-up.
  int32 index_engine_version = 3;
  // Positive uncompressed index bytes, matching FieldIndexInfo.index_size for
  // load-resource estimation; not the size of the cluster description file.
  int64 index_size = 4;
}

// Metadata for one clustering field, owned by the complete PartitionStatsSnapshot.
// Cluster descriptions live in the referenced file, not in snapshot metadata.
// The field type selects their interpretation; physical ranges are type-neutral.
message PartitionClusteringStats {
  uint32 format_version = 1;
  int64 field_id = 2;
  schema.DataType data_type = 3;
  int64 dim = 4; // Vector dimension; inapplicable (zero) for a scalar field.
  uint32 num_clusters = 5;
  // Complete object key for immutable cluster descriptions. Entry order defines
  // cluster offsets and index labels for this snapshot. For FloatVector the
  // payload is ClusteringCentroidsStats, with one centroid per cluster. Scalar
  // descriptions, mapping and query support are deferred; no scalar producer is
  // enabled by this contract. Empty exactly when num_clusters is zero.
  string clusters_file = 6;
  // Required for a nonempty table, absent for an empty table. Built from the
  // complete cluster descriptions in final offset order before publication.
  // Index files and metadata are immutable with the snapshot.
  ClusteringIndexInfo clustering_index = 7;
  // Complete segment grouping for this snapshot. Array positions are local
  // group offsets, not global IDs. Every covered segment belongs to exactly
  // one group; every cluster's ranges must lie entirely within one group.
  // Empty exactly when the complete snapshot is empty.
  repeated ClusteringGroup groups = 8;
}

// A group owns one or more segments. Cluster membership is derived from the
// referenced SegmentStats.ClusteringRanges, not persisted a second time.
// Compaction selection/publication must separately enforce complete replacement
// of each touched group against the pinned base snapshot. Query pruning still
// selects individual cluster ranges, not all rows in a group.
message ClusteringGroup {
  // Distinct IDs referencing SegmentStats entries in the owning snapshot.
  repeated int64 segment_ids = 1;
}

// Embedded in SegmentStats; field and cluster identity come from the owning
// snapshot's PartitionClusteringStats. This layout also applies to scalar value
// groups once scalar mapping produces contiguous rows. A cluster may span
// segments, but has at most one contiguous range in each segment.
message ClusteringRange {
  uint32 cluster_offset = 1; // Offset into this snapshot's cluster table; zero is valid.
  int64 row_offset = 2;      // Final physical segment row offset.
  int64 row_count = 3;       // Positive; interval is [offset, offset + count).
}
