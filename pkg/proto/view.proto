syntax = "proto3";
package milvus.proto.view;

import "common.proto";
import "internal.proto";

option go_package = "github.com/milvus-io/milvus/pkg/v3/proto/viewpb";

// ViewSyncService transports QueryView state transitions between the
// coordinator and StreamingNode/QueryNode followers. State-machine execution
// remains outside this transport contract.
service ViewSyncService {
    rpc SyncQueryView(stream SyncRequest) returns (stream SyncResponse) {
    }
}

// DataVersion is the composite version embedded in a QueryView version.
// Values are ordered lexicographically by
// (streaming_version, compact_version).
message DataVersion {
    int64 streaming_version = 1;
    int64 compact_version = 2;
}

// DataViewOfCollection is the complete loadable sealed-segment membership
// snapshot for one collection at a DataVersion.
message DataViewOfCollection {
    int64 collection_id = 1;
    repeated DataViewOfShard shards = 2;
    DataVersion data_version = 3;
}

// DataViewOfShard groups loadable segments by partition for one vchannel.
message DataViewOfShard {
    string vchannel = 1;
    repeated DataViewOfPartition partitions = 2;
    // Shard delete-retention frontier, preserved on the wire for the
    // QueryView consumer (QueryViewAtCoordBuilder). The DataCoord does not
    // advance it yet: publishing a safe, monotonic Transform frontier is
    // deferred until StreamingNode provides the shard-level Growing-Segment
    // Flush barrier. Consumers must treat 0 as "not published".
    uint64 transform_start_after_timetick = 3;
}

message DataViewOfPartition {
    int64 partition_id = 1;
    // segment_ids and segment_manifest_versions are parallel packed arrays.
    // A manifest version of 0 means the consumer must resolve SegmentInfo
    // through Coordinator metadata. A positive version identifies a canonical
    // StorageV3 manifest that the QueryNode can locate from collection,
    // partition, Segment ID, and this version alone.
    repeated int64 segment_ids = 2 [packed = true];
    repeated int64 segment_manifest_versions = 3 [packed = true];
}

// QueryViewState represents the distributed lifecycle of a QueryView.
enum QueryViewState {
    QueryViewStateUnknown = 0;
    QueryViewStatePreparing = 1;
    QueryViewStateReady = 2;
    QueryViewStateUp = 3;
    QueryViewStateDown = 4;
    QueryViewStateUnrecoverable = 5;
    QueryViewStateDropping = 6;
    QueryViewStateDropped = 7;
    // StreamingNode-only state while WAL recovery is catching up.
    QueryViewStateUpRecovering = 8;
}

// QueryViewOfShard is the state-machine snapshot for one shard and replica.
message QueryViewOfShard {
    QueryViewMeta meta = 1;
    repeated QueryViewOfQueryNode query_node = 2;
    QueryViewOfStreamingNode streaming_node = 3;
}

// QueryViewMeta identifies a QueryView and carries its current lifecycle state.
message QueryViewMeta {
    int64 collection_id = 1;
    int64 replica_id = 2;
    string vchannel = 3;
    QueryViewVersion version = 4;
    QueryViewState state = 5;
    uint64 load_info_version = 6;
    uint64 transform_start_after_timetick = 7;
}

// QueryViewOfStreamingNode is the StreamingNode-local part of a QueryView.
// The node is identified implicitly by the shard's vchannel binding.
message QueryViewOfStreamingNode {
}

// QueryViewOfQueryNode contains the segment assignments for one QueryNode.
message QueryViewOfQueryNode {
    int64 node_id = 1;
    repeated QueryViewOfPartition partitions = 2;
}

// QueryViewVersion is ordered lexicographically by
// (data_version, query_version).
message QueryViewVersion {
    DataVersion data_version = 1;
    int64 query_version = 2;
}

// QueryViewOfPartition tracks assigned and ready segments for one partition.
message QueryViewOfPartition {
    int64 partition_id = 1;
    repeated int64 segment_ids = 2;
    repeated int64 ready_segment_ids = 3;
}

// SyncRequest carries an atomic state-machine input or closes the stream.
message SyncRequest {
    oneof request {
        SyncQueryViewsRequest views = 1;
        SyncCloseRequest close = 2;
    }
}

// SyncQueryViewsRequest atomically applies QueryView states on one work node.
message SyncQueryViewsRequest {
    repeated QueryViewOfShard query_views = 1;
}

message SyncCloseRequest {
}

// SyncResponse carries follower state reports or acknowledges stream close.
message SyncResponse {
    oneof response {
        SyncQueryViewsResponse views = 1;
        SyncCloseResponse close = 2;
    }
}

// SyncQueryViewsResponse reports the follower's latest local states.
message SyncQueryViewsResponse {
    repeated QueryViewOfShard query_views = 1;
}

message SyncCloseResponse {
}

// ShardID identifies one shard within a replica.
message ShardID {
    int64 replica_id = 1;
    string vchannel = 2;
}

// ViewCode is the error code for view-related operations.
// Transported via gRPC status details (not embedded in response messages),
// following the same pattern as StreamingCode / StreamingError.
enum ViewCode {
    VIEW_CODE_OK               = 0;
    VIEW_CODE_VIEW_INVALIDATED = 1;  // View version is no longer valid (Down/Dropped).
    VIEW_CODE_VIEW_NOT_FOUND   = 2;  // View version not found on this node.
    VIEW_CODE_ON_SHUTDOWN      = 3;  // Node is shutting down.
    VIEW_CODE_NOT_PRIMARY      = 4;  // Node is not the primary replica for this shard (strong consistency requires primary).
    VIEW_CODE_UNKNOWN          = 999;
}

// ViewError is the error type for view-related operations.
// Attached to gRPC status details for error propagation.
message ViewError {
    ViewCode code = 1;
    string cause  = 2;
}

//
// ======================== Shared Types ========================
//

// QueryWorkNode identifies a query node by its node ID.
message QueryWorkNode {
    int64 node_id = 1;
}

// StreamingWorkNode identifies a streaming node by its bound physical channel.
message StreamingWorkNode {
    string pchannel = 1;
}

// QueryPlanWorkNode identifies a target work node for Phase 2 dispatch.
message QueryPlanWorkNode {
    oneof node {
        QueryWorkNode query_node = 1;
        StreamingWorkNode streaming_node = 2;
    }
}

//
// ======================== Query Plan Service (Phase 1) ========================
//

// QueryPlanMVCC carries the WAL read frontiers used by QueryView execution.
message QueryPlanMVCC {
    // Latest timetick of the growing stream. StreamingNode waits for growing
    // runtime visibility up to this timetick before executing growing segments.
    uint64 growing_timetick = 1;
    // Latest timetick of the transforming stream. StreamingNode and QueryNode
    // wait for transform visibility up to this timetick before execution.
    uint64 transforming_timetick = 2;
}

// QueryPlanService generates shard-level query plans.
// Only implemented by StreamingNode.
// Proxy calls this to obtain a consistent snapshot reference (view version, MVCC,
// work node list) and to run global optimizers (BM25 IDF, search param tuning).
// Also provides a lightweight GetMVCCTimestamp RPC for cross-replica strong consistency,
// where Proxy obtains MVCC from the primary replica and forwards it to another replica.
service QueryPlanService {
    rpc GetQueryPlan(GetQueryPlanRequest) returns (GetQueryPlanResponse) {}
    // GetMVCCTimestamp returns only the MVCC frontiers from the primary replica's WAL.
    // Lightweight alternative to GetQueryPlan for cross-replica strong consistency:
    // Proxy gets MVCC from primary, then calls GetQueryPlan on the target replica with the pre-obtained frontiers.
    // Returns VIEW_CODE_NOT_PRIMARY if the node is not the primary replica.
    rpc GetMVCCTimestamp(GetMVCCTimestampRequest) returns (GetMVCCTimestampResponse) {}
}

message GetQueryPlanRequest {
    int64 collection_id = 1;
    ShardID shard_id = 2;
    // Mutually exclusive MVCC source:
    // - consistency_level: SN generates MVCC frontiers from WAL based on consistency level.
    //   For Strong consistency, returns VIEW_CODE_NOT_PRIMARY if not the primary replica.
    // - query_plan_mvcc: Proxy provides pre-obtained MVCC frontiers (e.g., from primary replica
    //   via GetMVCCTimestamp). SN uses it directly, skipping WAL lookup.
    oneof mvcc {
        common.ConsistencyLevel consistency_level = 3;
        QueryPlanMVCC query_plan_mvcc = 7;
    }
    repeated int64 partition_ids = 4;
    // Original request for global optimization (BM25 IDF, search param tuning, etc.).
    // Global optimizers may modify serialized_expr_plan and placeholder_group within.
    // TODO: replace with native view request types once legacy internal protos are removed.
    oneof request {
        internal.SearchRequest legacy_search_request = 5;
        internal.RetrieveRequest legacy_retrieve_request = 6;
    }
}

message GetMVCCTimestampRequest {
    string vchannel = 1;
}

message GetMVCCTimestampResponse {
    QueryPlanMVCC mvcc = 1;
}

message GetQueryPlanResponse {
    QueryPlan plan = 1;
}

// QueryPlan contains everything needed to dispatch Phase 2 requests.
// Fields are aligned with Phase 2 request messages for fast split:
//   for each work_node: send { req: plan.legacy_search_request, shard_id: plan.shard_id, version: plan.version }
// The plan is reusable — Proxy can issue multiple Phase 2 calls (search + requery)
// against the same plan as long as the view version remains valid.
message QueryPlan {
    QueryViewVersion version = 1;
    ShardID shard_id = 2;
    QueryPlanMVCC mvcc = 3;
    repeated QueryPlanWorkNode work_nodes = 4;
    // Request after global optimization. Proxy forwards mvcc with the request
    // before dispatching to Phase 2.
    // TODO: replace with native view request types once legacy internal protos are removed.
    oneof request {
        internal.SearchRequest legacy_search_request = 5;
        internal.RetrieveRequest legacy_retrieve_request = 6;
    }
}

//
// ======================== View Query Service (Phase 2) ========================
//

// ViewQueryService executes queries on a specific view version.
// Implemented by both StreamingNode and QueryNode.
// Each node determines which segments to query based on the view version.
service ViewQueryService {
    // SearchOnView executes a vector search on segments belonging to the given view version.
    rpc SearchOnView(SearchOnViewRequest) returns (SearchOnViewResponse) {}
    // QueryOnView executes a query (retrieve by expression) on segments belonging to the given view version.
    rpc QueryOnView(QueryOnViewRequest) returns (QueryOnViewResponse) {}
    // RequeryOnView fetches output fields for a set of PKs after Proxy-side reduce.
    // Uses the same view version as the preceding search/query to ensure consistency.
    rpc RequeryOnView(RequeryOnViewRequest) returns (RequeryOnViewResponse) {}
}

message SearchOnViewRequest {
    // TODO: replace with native view request types once legacy internal protos are removed.
    internal.SearchRequest legacy_req = 1;
    ShardID shard_id = 2;
    QueryViewVersion version = 3;
    QueryPlanMVCC mvcc = 4;
}

message SearchOnViewResponse {
    // TODO: replace with native view result types once legacy internal protos are removed.
    internal.SearchResults legacy_results = 1;
}

message QueryOnViewRequest {
    // TODO: replace with native view request types once legacy internal protos are removed.
    internal.RetrieveRequest legacy_req = 1;
    ShardID shard_id = 2;
    QueryViewVersion version = 3;
    QueryPlanMVCC mvcc = 4;
}

message QueryOnViewResponse {
    // TODO: replace with native view result types once legacy internal protos are removed.
    internal.RetrieveResults legacy_results = 1;
}

message RequeryOnViewRequest {
    // TODO: replace with native view request types once legacy internal protos are removed.
    internal.RetrieveRequest legacy_req = 1;
    ShardID shard_id = 2;
    QueryViewVersion version = 3;
    QueryPlanMVCC mvcc = 4;
}

message RequeryOnViewResponse {
    // TODO: replace with native view result types once legacy internal protos are removed.
    internal.RetrieveResults legacy_results = 1;
}
