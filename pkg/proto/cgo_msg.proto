syntax = "proto3";

package milvus.proto.cgo;
option go_package="github.com/milvus-io/milvus/pkg/v3/proto/cgopb";

import "schema.proto";
import "index_coord.proto";
import "segcore.proto";

message LoadIndexInfo {
  int64 collectionID = 1;
  int64 partitionID = 2;
  int64 segmentID = 3;
  schema.FieldSchema field = 5;
  bool enable_mmap = 6;
  string mmap_dir_path = 7; //Deprecated
  int64 indexID = 8;
  int64 index_buildID = 9;
  int64 index_version = 10;
  map<string, string> index_params = 11;
  repeated string index_files = 12;
  string uri = 13;
  int64 index_store_version = 14 [deprecated = true];
  int32 index_engine_version = 15;
  int64 index_file_size = 16;
  int64 num_rows = 17;
  int32 current_scalar_index_version = 18;
  index.IndexStorePathVersion index_store_path_version = 19;
}

message IndexStats {
  int64 mem_size = 1;
  repeated SerializedIndexFileInfo serialized_index_infos = 3;
}

message SerializedIndexFileInfo {
  string file_name = 1;
  int64 file_size = 2;
}

// Materialized Function Chain inputs passed from Go to segcore. This is an
// in-process CGO payload, not a client or component RPC message.
message FunctionChainInputPlan {
  repeated FunctionChainInput inputs = 1;
}

message FunctionChainInput {
  int64 source_field_id = 1;
  schema.DataType target_data_type = 2;
  string logical_name = 3;
  repeated string nested_path = 4;
  bool is_json_path = 5;
}

// Metadata-only field/index estimate for one complete loader request.
message SegmentLoadResources {
  schema.CollectionSchema schema = 1;
  repeated segcore.FieldBinlog fields = 2;
  repeated LoadIndexInfo indexes = 3;
  int64 storage_version = 4;
  bool external_collection = 5;
  bool external_lazy_load = 6;
}

message BatchLoadResourceRequest {
  repeated SegmentLoadResources segments = 1;
  bool mmap_vector_field = 2;
  bool mmap_scalar_field = 3;
  bool prefer_field_data_when_index_has_raw_data = 4;
  bool final_only = 5; // QueryCoord needs residency, without initializing load executors.
}

message CoreResourceUsage {
  uint64 final_memory_bytes = 1;
  uint64 final_disk_bytes = 2;
  uint64 max_memory_bytes = 3;
  uint64 max_disk_bytes = 4;
  // Timestamp structures are not evictable; the other costs above are.
  uint64 timestamp_memory_bytes = 5;
  // Raw bytes eligible for an interim index; Go applies the build factor.
  uint64 interim_index_bytes = 6;
  repeated uint64 field_gpu_memory_bytes = 7;
  uint64 mmap_field_count = 8;
}

message BatchLoadResourceResponse {
  repeated CoreResourceUsage segments = 1;
  CoreResourceUsage total = 2;
}
