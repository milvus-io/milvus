extraConfigFiles:
  user.yaml: |+
    # PyUDF reranking requires both the runtime and Proxy resource synchronization.
    function:
      pyUDF:
        enabled: true
    common:
      fileResource:
        mode:
          proxy: sync

metrics:
  serviceMonitor:
    enabled: true

kafka:
  metrics:
    kafka:
      enabled: true
    jmx:
      enabled: true
    serviceMonitor:
      enabled: true