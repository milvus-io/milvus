line-length = 120
target-version = "py312"
extend-exclude = [
    ".venv",
    "__pycache__",
    "assets",
    "*.ipynb_checkpoints",
]

[lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line-too-long handled by formatter
    "E741",  # ambiguous variable names (l, I, O) common in test code

    # The rules below cannot be satisfied without editing test behaviour, so they
    # are disabled rather than left permanently red. Everything mechanical
    # (whitespace, import hygiene, formatting) is enforced.
    "F403",  # `from common.common_type import *` is the base idiom of this suite
    "F405",  # names resolved through those star imports
    "F841",  # assigned-but-unused: tests keep call results on purpose
    "E722",  # bare `except:` is widespread in teardown/cleanup paths
    "E402",  # imports after sys.path manipulation
    "E712",  # `== True` / `== False`: rewriting to a truth test would change
             # behaviour for None (e.g. `hit.get(field) == False`)
    "UP031",  # printf-style formatting: mechanical rewrite, but it is a code change
]

[lint.per-file-ignores]
"__init__.py" = ["F401"]
"conftest.py" = ["F401", "F811"]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
