[pytest]


addopts = -p no:locust -v
#  python3 -W ignore -m pytest

log_format = [%(asctime)s - %(levelname)s - %(name)s]: %(message)s (%(filename)s:%(lineno)s)
log_date_format = %Y-%m-%d %H:%M:%S
markers =
    tags: custom tags for test cases
    CDC: CDC sync test cases (not run in regular e2e pipeline)
    spark_e2e: requires a remote Spark runtime
    spark_backfill_v3: Spark-Milvus Backfill tests requiring real Storage V3 segments
    spark_backfill_v2: Spark-Milvus Backfill tests requiring real Storage V2 segments
    spark_backfill_core: core read, backfill, commit, and visibility scenarios
    spark_backfill_negative: invalid Parquet, schema, mode, and batch-size scenarios
    spark_backfill_compaction: Snapshot compaction-protection and stale-result scenarios
    spark_backfill_known_gap: tracked expected failures for known server protection gaps

filterwarnings =
    ignore::DeprecationWarning
    ignore::pymilvus.decorators.PyMilvusDeprecationWarning
    ignore:invalid escape sequence:SyntaxWarning

asyncio_default_fixture_loop_scope = function
timeout_method = thread
